<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Test API</title>
<style>
  body { background: #0a0a0f; color: #e8e8f0; font-family: monospace; padding: 2rem; }
  h2 { color: #00e5a0; }
  select, button {
    background: #13131a; border: 1px solid #1e1e2e; color: #e8e8f0;
    padding: 0.5rem 1rem; border-radius: 6px; font-family: monospace;
    font-size: 0.9rem; cursor: pointer; margin: 0.3rem;
  }
  button:hover { border-color: #00e5a0; color: #00e5a0; }
  #url { color: #5a5a7a; margin: 1rem 0; font-size: 0.85rem; }
  #output {
    background: #13131a; border: 1px solid #1e1e2e; border-radius: 8px;
    padding: 1.5rem; margin-top: 1rem; white-space: normal;
    font-size: 0.9rem; max-height: 600px; overflow-y: auto;
    color: #e8e8f0;
  }
  #output table {
    width: 100%; border-collapse: collapse; margin-top: 1rem;
  }
  #output th, #output td {
    border: 1px solid #1e1e2e; padding: 0.6rem; text-align: left;
  }
  #output th {
    background: #1f1f2b;
  }
  .match-card {
    border: 1px solid #1e1e2e; padding: 0.9rem; margin-bottom: 0.9rem; border-radius: 8px;
    background: #12121b;
  }
  .match-card div { margin-bottom: 0.35rem; }
</style>
</head>
<body>

<h2>Football API — Test</h2>

<div>
  <select id="lega" onchange="updateTeams()">
    <option value="serie_a">Serie A</option>
    <option value="la_liga">La Liga</option>
    <option value="premier_league">Premier League</option>
    <option value="ligue_1">Ligue 1</option>
    <option value="bundesliga">Bundesliga</option>
  </select>

  <select id="season" onchange="updateTeams()">
    <option value="">Scegli stagione</option>
    <option value="2024">2024</option>
    <option value="2023">2023</option>
    <option value="2022">2022</option>
  </select>

  <select id="squadra" disabled>
    <option value="">Scegli prima la stagione</option>
  </select>

  <button onclick="chiama('info')">Info</button>
  <button onclick="chiama('standings')">Classifica</button>
  <button onclick="chiama('fixtures')">Partite</button>
</div>

<div>
  <button id="show-head2head" onclick="showHead2Head()">Head2Head</button>
</div>

<div id="head2head-section" style="display:none; margin-top: 1rem;">
  <div>
    <label>Avversario per Head2Head:</label>
    <select id="opponent" disabled>
      <option value="">Scegli prima la stagione</option>
    </select>
    <button onclick="chiamaHead2Head()">Confronta</button>
  </div>
</div>

<div id="url"></div>
<div id="output">Seleziona lega, stagione e squadra per avviare.</div>

<script>
const BASE = './index.php';

const teams = {
  serie_a: ["lazio","milan","cagliari","napoli","udinese","genoa","juventus","roma","atalanta","bologna","fiorentina","torino","verona","inter","empoli","venezia","parma","lecce","como","monza"],
  la_liga: ["barcelona","real_madrid","atletico_madrid","sevilla","valencia","villarreal","athletic_bilbao","real_sociedad","betis","osasuna","celta_vigo","getafe","rayo_vallecano","mallorca","las_palmas","girona","alaves","leganes","espanyol","valladolid"],
  premier_league: ["manchester_city","arsenal","liverpool","aston_villa","tottenham","chelsea","newcastle","manchester_united","west_ham","crystal_palace","brighton","wolverhampton","fulham","bournemouth","nottingham_forest","brentford","everton","leicester","southampton","ipswich"],
  ligue_1: ["psg","marseille","lyon","lille","monaco","nice","lens","rennes","strasbourg","toulouse","brest","montpellier","reims","nantes","le_havre","saint_etienne","auxerre","angers","saint_gilloise","metz"],
  bundesliga: ["bayern_munich","borussia_dortmund","bayer_leverkusen","rb_leipzig","eintracht_frankfurt","wolfsburg","freiburg","hoffenheim","werder_bremen","borussia_monchengladbach","augsburg","union_berlin","stuttgart","mainz","heidenheim","st_pauli","holstein_kiel","bochum"]
};

function escapeHtml(text) {
  return String(text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function setDropdown(select, items, placeholder) {
  if (!items || items.length === 0) {
    select.innerHTML = `<option value="">${escapeHtml(placeholder)}</option>`;
    select.disabled = true;
    return;
  }

  const options = items.map(item => `<option value="${escapeHtml(item)}">${escapeHtml(item.replace(/_/g, ' '))}</option>`).join('');
  select.innerHTML = `<option value="">${escapeHtml(placeholder)}</option>${options}`;
  select.disabled = false;
}

function updateTeams() {
  const lega = document.getElementById('lega').value;
  const season = document.getElementById('season').value;
  const selSquadra = document.getElementById('squadra');
  const selOpponent = document.getElementById('opponent');

  if (!season) {
    setDropdown(selSquadra, [], 'Scegli prima la stagione');
    setDropdown(selOpponent, [], 'Scegli prima la stagione');
    return;
  }

  const teamList = teams[lega] || [];
  if (teamList.length === 0) {
    setDropdown(selSquadra, [], 'Nessuna squadra disponibile');
    setDropdown(selOpponent, [], 'Nessuna squadra disponibile');
    return;
  }

  setDropdown(selSquadra, teamList, 'Scegli squadra');
  setDropdown(selOpponent, teamList, 'Scegli avversario');
}

function showHead2Head() {
  document.getElementById('head2head-section').style.display = 'block';
  renderMessage('Seleziona l\'avversario e premi Confronta.');
}

function renderMessage(message) {
  document.getElementById('url').textContent = '';
  document.getElementById('output').innerHTML = `<p>${escapeHtml(message)}</p>`;
}

function renderResult(data) {
  const output = document.getElementById('output');
  output.innerHTML = '';

  if (!data || data.error || data.errore) {
    const error = data?.error || data?.errore || 'Errore sconosciuto';
    output.innerHTML = `<p style="color:#ff7777;"><strong>Errore:</strong> ${escapeHtml(error)}</p>`;
    return;
  }

  if (data.club) {
    output.innerHTML = `
      <h3>Info club</h3>
      <p><strong>Nome:</strong> ${escapeHtml(data.club.nome)}</p>
      <p><strong>Paese:</strong> ${escapeHtml(data.club.paese)}</p>
      <p><strong>Fondazione:</strong> ${escapeHtml(data.club.fondazione)}</p>
      <p><strong>Stadio:</strong> ${escapeHtml(data.stadio.nome)}</p>
      <p><strong>Città:</strong> ${escapeHtml(data.stadio.citta)}</p>
      <p><strong>Capienza:</strong> ${escapeHtml(data.stadio.capienza)}</p>
      <p><strong>Manto:</strong> ${escapeHtml(data.stadio.manto)}</p>
    `;
    return;
  }

  if (data.classifica) {
    const rows = data.classifica.map(row => `
      <tr>
        <td>${escapeHtml(row.posizione)}</td>
        <td>${escapeHtml(row.squadra)}</td>
        <td>${escapeHtml(row.punti)}</td>
        <td>${escapeHtml(row.partite)}</td>
        <td>${escapeHtml(row.vittorie)}</td>
        <td>${escapeHtml(row.pareggi)}</td>
        <td>${escapeHtml(row.sconfitte)}</td>
        <td>${escapeHtml(row.diff_reti)}</td>
      </tr>
    `).join('');

    output.innerHTML = `
      <h3>Classifica stagione ${escapeHtml(data.stagione)}</h3>
      <table>
        <thead>
          <tr><th>#</th><th>Squadra</th><th>P</th><th>G</th><th>V</th><th>P</th><th>S</th><th>DR</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
    return;
  }

  if (data.riepilogo || data.partite) {
    const matches = (data.partite || []).map(match => `
      <div class="match-card">
        <div><strong>${escapeHtml(match.data)}</strong> - ${escapeHtml(match.stadio || 'Stadio non disponibile')}</div>
        <div>${escapeHtml(match.casa.squadra)} vs ${escapeHtml(match.trasferta.squadra)}</div>
        <div><strong>${escapeHtml(match.stato)}</strong></div>
        ${match.risultato ? `<div>Risultato: ${escapeHtml(match.risultato.casa)} - ${escapeHtml(match.risultato.trasferta)}</div>` : '<div>Risultato: non disponibile</div>'}
      </div>
    `).join('');

    const summary = data.riepilogo ? `
      <h3>Head2Head stagione ${escapeHtml(data.stagione)}</h3>
      <p><strong>Vittorie:</strong> ${escapeHtml(data.riepilogo.vittorie)}</p>
      <p><strong>Pareggi:</strong> ${escapeHtml(data.riepilogo.pareggi)}</p>
      <p><strong>Sconfitte:</strong> ${escapeHtml(data.riepilogo.sconfitte)}</p>
    ` : `
      <h3>Partite stagione ${escapeHtml(data.stagione)}</h3>
      <p><strong>Totale partite:</strong> ${escapeHtml(data.totale_partite)}</p>
    `;

    output.innerHTML = `${summary}<div class="matches">${matches}</div>`;
    return;
  }

  output.innerHTML = `<pre>${escapeHtml(JSON.stringify(data, null, 2))}</pre>`;
}

function validateSelection(team, season, requireOpponent = false) {
  if (!season) {
    renderMessage('Scegli prima la stagione.');
    return false;
  }
  if (!team) {
    renderMessage('Scegli prima la squadra.');
    return false;
  }
  if (requireOpponent) {
    const opponent = document.getElementById('opponent').value;
    if (!opponent) {
      renderMessage('Scegli prima l\'avversario.');
      return false;
    }
    if (opponent === team) {
      renderMessage('La squadra e l\'avversario non possono essere uguali.');
      return false;
    }
  }
  return true;
}

async function chiama(action) {
  const lega = document.getElementById('lega').value;
  const squadra = document.getElementById('squadra').value;
  const season = document.getElementById('season').value;

  if (!validateSelection(squadra, season)) {
    return;
  }

  const url = `${BASE}?url=${action}&league=${lega}&team=${squadra}&season=${season}`;
  document.getElementById('url').textContent = 'Chiamata: ' + url;
  document.getElementById('output').textContent = 'Caricamento...';

  try {
    const res = await fetch(url);
    if (!res.ok) {
      const text = await res.text();
      throw new Error(`HTTP ${res.status} ${res.statusText}: ${text}`);
    }
    const data = await res.json();
    renderResult(data);
  } catch (e) {
    renderMessage('Errore: ' + e.message);
  }
}

async function chiamaHead2Head() {
  const lega = document.getElementById('lega').value;
  const squadra = document.getElementById('squadra').value;
  const opponent = document.getElementById('opponent').value;
  const season = document.getElementById('season').value;

  if (!validateSelection(squadra, season, true)) {
    return;
  }

  const url = `${BASE}?url=head2head&league=${lega}&team=${squadra}&opponent=${opponent}&season=${season}`;
  document.getElementById('url').textContent = 'Chiamata: ' + url;
  document.getElementById('output').textContent = 'Caricamento...';

  try {
    const res = await fetch(url);
    if (!res.ok) {
      const text = await res.text();
      throw new Error(`HTTP ${res.status} ${res.statusText}: ${text}`);
    }
    const data = await res.json();
    renderResult(data);
  } catch (e) {
    renderMessage('Errore: ' + e.message);
  }
}

updateTeams();
</script>
</body>
</html>
