<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>FootballStats</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">

</head>

<body>

  <!-- ── HEADER ──────────────────────────────────────────────────── -->
  <header>
    <a class="logo" href="#">
      <div class="logo-icon">⚽</div>
      <span class="logo-text">Football<span>Stats</span></span>
    </a>
    <nav id="nav">
      <button class="nav-btn active" data-view="info">Info</button>
      <button class="nav-btn" data-view="standings">Classifica</button>
      <button class="nav-btn" data-view="fixtures">Partite</button>
      <button class="nav-btn" data-view="head2head">Testa a Testa</button>
      <button class="nav-btn" data-view="favorites">⭐ Preferiti</button>
    </nav>
  </header>

  <!-- ── CONTROLS ────────────────────────────────────────────────── -->
  <div class="controls" id="controls">
    <div class="ctrl-group">
      <span class="ctrl-label">Lega</span>
      <select id="sel-league">
        <option value="">- Seleziona Lega -</option>
        <option value="serie_a">IT - Serie A</option>
        <option value="premier_league">GB - Premier League</option>
        <option value="la_liga">ES - La Liga</option>
        <option value="bundesliga">DE - Bundesliga</option>
        <option value="ligue_1">FR - Ligue 1</option>
      </select>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">Squadra</span>
      <select id="sel-team" disabled>
        <option value="">- Prima seleziona lega -</option>
      </select>
    </div>
    <div class="ctrl-group" id="grp-opponent" style="display:none">
      <span class="ctrl-label">Avversario</span>
      <select id="sel-opponent" disabled>
        <option value="">- Seleziona avversario -</option>
      </select>
    </div>
    <div class="ctrl-group" id="grp-season">
      <span class="ctrl-label">Stagione</span>
      <select id="sel-season">
        <option value="2024">2024</option>
        <option value="2023">2023</option>
        <option value="2022">2022</option>
      </select>
    </div>
    <button class="btn-go" id="btn-go">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.35-4.35" />
      </svg>
      Cerca
    </button>
  </div>

  <!-- ── MAIN ──────────────────────────────────────────────────────── -->
  <main id="main">
    <div class="welcome fade-in">
      <div class="welcome-icon">⚽</div>
      <h1>Statistiche <span>Calcio</span></h1>
      <p>Seleziona una lega, una squadra e la stagione per esplorare classifiche, risultati e confronti.</p>
      <div class="welcome-hints">
        <span class="hint-chip">📊 Classifica</span>
        <span class="hint-chip">📅 Partite</span>
        <span class="hint-chip">⚔️ Testa a Testa</span>
        <span class="hint-chip">🏟️ Info Squadra</span>
      </div>
    </div>
  </main>

  <script src="script.js?v=2"></script>

</body>

</html>
